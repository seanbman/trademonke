name: trademonke
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: TradeMonke <noreply@localhost>
description: |
  TradeMonke dry-run research workstation desktop bootstrap.
  Installs the Electron shell and launchers. First launch clones the
  GitHub repository to /opt/trademonke, builds research Docker images,
  and opens the GUI. Updates come from origin/main via git.
vendor: TradeMonke
homepage: https://github.com/seanbman/trademonke
license: Proprietary
depends:
  - ca-certificates
  - curl
  - git
  - zenity
  - libnotify-bin
  - python3
  - python3-venv
  - rsync
  - policykit-1
contents:
  - src: packaging/deb/staging/usr/lib/trademonke/
    dst: /usr/lib/trademonke
  - src: packaging/deb/bin/trademonke
    dst: /usr/bin/trademonke
    file_info:
      mode: 0755
  - src: packaging/deb/trademonke.desktop
    dst: /usr/share/applications/trademonke.desktop
  - src: desktop/assets/trade-monke-icon.png
    dst: /usr/share/icons/hicolor/1024x1024/apps/trademonke.png
  - src: desktop/assets/trade-monke-icon.png
    dst: /usr/share/icons/hicolor/256x256/apps/trademonke.png
  # Desktop assets (including the app icon) are already staged under
  # packaging/deb/staging/usr/lib/trademonke/desktop/ via build-deb.sh.
scripts:
  postinstall: packaging/deb/scripts/postinst
  postremove: packaging/deb/scripts/postrm

