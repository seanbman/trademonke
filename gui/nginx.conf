server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location /api/v1/gui/ws {
    proxy_pass http://platform-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 75s;
  }
  location /api/v1/relay/ws {
    proxy_pass http://platform-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 75s;
  }
  location /api/ { proxy_pass http://platform-api:8000; proxy_http_version 1.1; }
  location /episodes/ { proxy_pass http://platform-api:8000; proxy_http_version 1.1; }
  location / { try_files $uri /index.html; }
}
