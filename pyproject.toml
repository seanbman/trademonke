[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "ccxt>=4.5,<5",
  "fastapi>=0.115,<1",
  "starlette>=0.46,<1",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn[standard]>=0.32,<1",
  "websockets>=14,<17",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]

[project.scripts]
relay-agent = "app.relay.agent:main"
platform-api = "app.api.server:main"
market-data = "app.market_data.cli:main"
telegram-bot = "app.telegram.cli:main"
research = "app.research.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
